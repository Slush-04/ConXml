name: Windows build
run-name: ConXml build ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión estable X.Y.Z que se compilará'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-build
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Sincronizar versión de compilación
        shell: pwsh
        env:
          CONXML_REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:CONXML_REQUESTED_VERSION
          python scripts/release_version.py $version
          if ($LASTEXITCODE -ne 0) { throw "Versión inválida" }
          "CONXML_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compilar y probar
        shell: pwsh
        run: ./scripts/build_installer.ps1
      - name: Probar instalación y actualización reales
        shell: pwsh
        run: ./scripts/test_installed_update.ps1
      - name: Guardar diagnóstico de actualización
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ConXml-update-diagnostics
          path: dist/update-smoke/**/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ConXml-Windows-dist
          path: |
            dist/installer/*
            dist/*.zip*
          if-no-files-found: error
          retention-days: 30
      - name: Compilación lista
        shell: pwsh
        run: Write-Host "ConXml $env:CONXML_RELEASE_VERSION quedó como artefacto privado de Actions. No se publicó una Release."
