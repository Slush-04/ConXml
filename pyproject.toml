[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conxml"
version = "0.1.0"
description = "Gestor CFDI multi-RFC del despacho: parser CFDI 4.0/REP, estatus SAT y exportes Excel"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2,<7",
    "darkdetect>=0.8",
    "lxml>=5.0,<7",
    "openpyxl>=3.1,<4",
    "requests>=2.31,<3",
]

[project.scripts]
conxml = "conxml.cli:main"
conxml-gui = "conxml.ui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]
build = [
    "pyinstaller>=6",
    "pyinstaller-hooks-contrib>=2025",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: prueba contra servicios reales del SAT (requiere red)",
]
