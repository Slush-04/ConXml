[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conxml"
version = "0.1.0"
description = "Gestor CFDI multi-RFC del despacho: parser CFDI 4.0/REP, estatus SAT y exportes Excel"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "requests>=2.31",
]

[project.scripts]
conxml = "conxml.cli:main"
conxml-gui = "conxml.ui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: prueba contra servicios reales del SAT (requiere red)",
]
