name: Windows release
run-name: ConXml release ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión estable X.Y.Z que publicará el Administrador'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Versionar build sin commits de metadatos
        shell: pwsh
        env:
          CONXML_REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:CONXML_REQUESTED_VERSION
          python scripts/release_version.py $version
          if ($LASTEXITCODE -ne 0) { throw "Versión inválida" }
          "CONXML_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Compilar y probar
        shell: pwsh
        run: ./scripts/build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ConXml-Windows-dist
          path: |
            dist/installer/*
            dist/*.zip*
          if-no-files-found: error
      - name: Publicar solo cuando instalador, paquete ZIP y pruebas estén listos
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:CONXML_RELEASE_VERSION"
          $exe = "dist/installer/ConXml-Setup-$env:CONXML_RELEASE_VERSION-windows-x64.exe"
          $zip = "dist/ConXml-$env:CONXML_RELEASE_VERSION-windows-x64.zip"
          # Borrador durante carga: latest no anuncia archivos incompletos.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "La versión ya existe; no sobrescribir una publicación." }
          gh release create $tag $exe "$exe.sha256" $zip "$zip.sha256" --target '${{ github.sha }}' --draft --title "ConXml $env:CONXML_RELEASE_VERSION" --notes "Instalador y paquete de actualización directa Windows x64. Conserva los datos locales."
          if ($LASTEXITCODE -ne 0) { throw "Falló la carga de la versión." }
          # GitHub's get-by-tag endpoint does not return drafts. Find this draft
          # via the authenticated releases collection, then use its release ID.
          $releaseId = gh api "repos/${{ github.repository }}/releases?per_page=100" --jq ".[] | select(.tag_name == `"$tag`") | .id"
          if (-not $releaseId) { throw "No se encontró el borrador de la versión." }
          $releaseId = $releaseId.Trim()
          $assetExe = gh api "repos/${{ github.repository }}/releases/$releaseId" --jq '.assets[] | select(.name | endswith(".exe")) | .digest'
          $expectedExe = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          if ($assetExe -ne "sha256:$expectedExe") { throw "Digest de instalador ausente o incorrecto; queda en borrador." }
          $assetZip = gh api "repos/${{ github.repository }}/releases/$releaseId" --jq '.assets[] | select(.name | endswith(".zip")) | .digest'
          $expectedZip = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($assetZip -ne "sha256:$expectedZip") { throw "Digest de ZIP ausente o incorrecto; queda en borrador." }
          # La cola no garantiza orden FIFO: un build anterior tardío no debe
          # sustituir latest de una versión más nueva.
          $latest = gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>$null
          $makeLatest = 'true'
          if ($LASTEXITCODE -eq 0 -and [version]$latest.TrimStart('v') -gt [version]$env:CONXML_RELEASE_VERSION) {
            $makeLatest = 'false'
          }
          gh api --method PATCH "repos/${{ github.repository }}/releases/$releaseId" -F draft=false -f "make_latest=$makeLatest" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar." }
